{% extends "layout.html" %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Daily Tracker</h3>

                <form action="/add" method="POST" class="row g-2">
                    <div class="col-md-6">
                        <input type="text" name="task" class="form-control" placeholder="Task or Activity" required>
                    </div>
                    <div class="col-md-4">
                        <select name="category" class="form-select" required>
                            <option value="" disabled selected>Category</option>
                            <option value="Study">Study</option>
                            <option value="Work">Work</option>
                            <option value="Health">Health</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <ul class="list-group list-group-flush">
                {% for item in items %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-secondary me-2">{{ item.category }}</span>
                            <span class="{% if item.completed %}text-decoration-line-through text-muted{% endif %}">
                                {{ item.task }}
                            </span>
                        </div>
                        <div class="d-flex gap-2">
                            <form action="/toggle/{{ item.id }}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-sm {% if item.completed %}btn-warning{% else %}btn-success{% endif %}">
                                    {% if item.completed %}Undo{% else %}Done{% endif %}
                                </button>
                            </form>
                            <form action="/delete/{{ item.id }}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">✕</button>
                            </form>
                        </div>
                    </li>
                {% else %}
                    <li class="list-group-item text-center text-muted py-4">No tasks added yet.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
